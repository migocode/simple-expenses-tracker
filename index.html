<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Recurring Expenses</title>

<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<style>
  :root {
    --ink: #1c2b2a;
    --paper: #f6f3ec;
    --line: #d8d1c0;
    --accent: #2f6f5e;
    --accent-dim: #9fc4b8;
    --danger: #a4453a;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body { padding-bottom: 60px; }

  header {
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 4px; font-size: 1.4rem; letter-spacing: -0.01em; }
  header .month { font-family: var(--mono); font-size: 0.85rem; color: var(--accent); }

  .summary {
    display: flex;
    gap: 1px;
    background: var(--line);
    margin: 16px 20px 0;
    border-radius: 10px;
    overflow: hidden;
  }
  .summary > div { flex: 1; background: var(--paper); padding: 12px 10px; text-align: center; }
  .summary .label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: #6b6459; }
  .summary .value { font-family: var(--mono); font-size: 1.05rem; margin-top: 2px; }
  .summary .paid .value { color: var(--accent); }
  .summary .remaining .value { color: var(--danger); }

  .list { margin: 20px 16px 0; }
  .empty {
    padding: 30px 10px;
    text-align: center;
    color: #8a8477;
    font-size: 0.9rem;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 8px;
    border-bottom: 1px solid var(--line);
  }
  .row.paid { background: rgba(47, 111, 94, 0.07); }
  .row.paid .name { text-decoration: line-through; color: #7a8481; }

  .check {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 7px;
    border: 2px solid var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--paper);
    font-size: 15px; line-height: 1;
    cursor: pointer;
  }
  .row.paid .check { background: var(--accent); border-color: var(--accent); }

  .info { flex: 1 1 auto; min-width: 0; }
  .name { font-size: 0.98rem; }
  .meta { font-size: 0.75rem; color: #8a8477; margin-top: 2px; }

  .amounts { flex: 0 0 auto; text-align: right; }
  .full { font-family: var(--mono); font-size: 0.95rem; }
  .monthly { font-family: var(--mono); font-size: 0.72rem; color: #8a8477; }

  .del {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: none;
    color: #a4453a;
    font-size: 15px;
    line-height: 1;
  }

  .add-section { margin: 24px 16px 0; }
  .add-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px dashed var(--accent-dim);
    background: none;
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 600;
  }

  .form {
    margin-top: 12px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fffdf8;
    display: none;
  }
  .form.open { display: block; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #6b6459;
    margin-bottom: 4px;
  }
  .field input, .field select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    font-size: 0.95rem;
    color: var(--ink);
    font-family: inherit;
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn-primary, .btn-secondary {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    font-size: 0.9rem;
    border: none;
  }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
  .btn-secondary { background: none; border: 1px solid var(--line); color: #6b6459; }

  footer {
    margin: 24px 20px 0;
    font-size: 0.72rem;
    color: #8a8477;
    line-height: 1.5;
  }
  footer button {
    margin-top: 12px;
    background: none;
    border: 1px solid var(--line);
    color: #8a8477;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.75rem;
  }
</style>
</head>
<body>

<header>
  <h1>Recurring Expenses</h1>
  <div class="month" id="monthLabel"></div>
</header>

<div class="summary">
  <div class="paid"><div class="label">Paid</div><div class="value" id="paidTotal">€0</div></div>
  <div class="remaining"><div class="label">Remaining</div><div class="value" id="remainingTotal">€0</div></div>
  <div><div class="label">Monthly total</div><div class="value" id="monthlyTotal">€0</div></div>
</div>

<div class="list" id="list"></div>

<div class="add-section">
  <button class="add-btn" id="toggleFormBtn">+ Add expense</button>
  <div class="form" id="form">
    <div class="field">
      <label>Name</label>
      <input type="text" id="fName" placeholder="e.g. Netflix">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Amount (€)</label>
        <input type="number" id="fAmount" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="field">
        <label>Charged every</label>
        <select id="fDivisor">
          <option value="1">1 month</option>
          <option value="2">2 months</option>
          <option value="3">3 months (quarterly)</option>
          <option value="6">6 months</option>
          <option value="12">12 months (yearly)</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Note (optional)</label>
      <input type="text" id="fNote" placeholder="e.g. Due on the 5th">
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<footer>
  Data is saved only in this browser (localStorage), independent of any account. Clearing browser data or switching devices/browsers will lose it. Checkboxes reset automatically each new calendar month; your list of expenses stays.
  <br>
  <button id="resetBtn">Reset this month's checkmarks</button>
  <button id="saveFileBtn">Save state to file</button>
  <button id="loadFileBtn">Load state from file</button>
  <input type="file" id="loadFileInput" accept="application/json,.json" style="display:none">
</footer>

<script>
const EXPENSES_KEY = "expenses:list";

function loadExpenses() {
  try {
    const raw = localStorage.getItem(EXPENSES_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveExpenses(list) {
  localStorage.setItem(EXPENSES_KEY, JSON.stringify(list));
}

function monthKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

function storageKey(id) {
  return "paid:" + monthKey() + ":" + id;
}

function fmt(n) {
  return "€" + n.toLocaleString("de-AT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function isPaid(id) {
  return localStorage.getItem(storageKey(id)) === "1";
}

function setPaid(id, val) {
  if (val) localStorage.setItem(storageKey(id), "1");
  else localStorage.removeItem(storageKey(id));
}

function freqLabel(divisor) {
  if (divisor === 1) return "Monthly";
  if (divisor === 12) return "Yearly";
  return "Every " + divisor + " months";
}

function render() {
  const d = new Date();
  document.getElementById("monthLabel").textContent =
    d.toLocaleDateString("en-US", { month: "long", year: "numeric" });

  const expenses = loadExpenses();
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (expenses.length === 0) {
    list.innerHTML = '<div class="empty">No expenses yet. Add your first one below.</div>';
  }

  let paidSum = 0, remainingSum = 0, monthlySum = 0;

  expenses.forEach(exp => {
    const monthlyAmt = exp.full / exp.divisor;
    monthlySum += monthlyAmt;
    const paid = isPaid(exp.id);
    if (paid) paidSum += monthlyAmt; else remainingSum += monthlyAmt;

    const row = document.createElement("div");
    row.className = "row" + (paid ? " paid" : "");
    row.innerHTML = `
      <div class="check" data-action="toggle">${paid ? "✓" : ""}</div>
      <div class="info" data-action="toggle">
        <div class="name">${escapeHtml(exp.name)}</div>
        <div class="meta">${freqLabel(exp.divisor)}${exp.note ? " · " + escapeHtml(exp.note) : ""}</div>
      </div>
      <div class="amounts" data-action="toggle">
        <div class="full">${fmt(exp.full)}</div>
        ${exp.divisor > 1 ? `<div class="monthly">${fmt(monthlyAmt)}/mo</div>` : ""}
      </div>
      <button class="del" data-action="delete">✕</button>
    `;
    row.querySelectorAll('[data-action="toggle"]').forEach(el => {
      el.addEventListener("click", () => { setPaid(exp.id, !isPaid(exp.id)); render(); });
    });
    row.querySelector('[data-action="delete"]').addEventListener("click", (e) => {
      e.stopPropagation();
      if (confirm(`Remove "${exp.name}"?`)) {
        const updated = loadExpenses().filter(x => x.id !== exp.id);
        saveExpenses(updated);
        render();
      }
    });
    list.appendChild(row);
  });

  document.getElementById("paidTotal").textContent = fmt(paidSum);
  document.getElementById("remainingTotal").textContent = fmt(remainingSum);
  document.getElementById("monthlyTotal").textContent = fmt(monthlySum);
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

const form = document.getElementById("form");
const toggleFormBtn = document.getElementById("toggleFormBtn");

toggleFormBtn.addEventListener("click", () => {
  form.classList.add("open");
  toggleFormBtn.style.display = "none";
  document.getElementById("fName").focus();
});

document.getElementById("cancelBtn").addEventListener("click", () => {
  closeForm();
});

function closeForm() {
  form.classList.remove("open");
  toggleFormBtn.style.display = "block";
  document.getElementById("fName").value = "";
  document.getElementById("fAmount").value = "";
  document.getElementById("fNote").value = "";
  document.getElementById("fDivisor").value = "1";
}

document.getElementById("saveBtn").addEventListener("click", () => {
  const name = document.getElementById("fName").value.trim();
  const amount = parseFloat(document.getElementById("fAmount").value);
  const divisor = parseInt(document.getElementById("fDivisor").value, 10);
  const note = document.getElementById("fNote").value.trim();

  if (!name) { alert("Please enter a name."); return; }
  if (isNaN(amount) || amount <= 0) { alert("Please enter a valid amount."); return; }

  const expenses = loadExpenses();
  expenses.push({
    id: "exp_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    name, full: amount, divisor, note
  });
  saveExpenses(expenses);
  closeForm();
  render();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Reset all checkmarks for this month? (Your expense list stays.)")) {
    loadExpenses().forEach(exp => setPaid(exp.id, false));
    render();
  }
});

// ---- Save / Load entire page state as a JSON file ----

function collectAllPaidEntries() {
  const paid = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith("paid:")) {
      paid[key] = localStorage.getItem(key);
    }
  }
  return paid;
}

function buildStateSnapshot() {
  return {
    app: "recurring-expenses-tracker",
    version: 1,
    savedAt: new Date().toISOString(),
    expenses: loadExpenses(),
    paid: collectAllPaidEntries()
  };
}

document.getElementById("saveFileBtn").addEventListener("click", () => {
  const state = buildStateSnapshot();
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `expenses-state-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById("loadFileBtn").addEventListener("click", () => {
  document.getElementById("loadFileInput").click();
});

document.getElementById("loadFileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    let state;
    try {
      state = JSON.parse(reader.result);
    } catch (err) {
      alert("That file isn't valid JSON.");
      e.target.value = "";
      return;
    }

    if (!state || !Array.isArray(state.expenses) || typeof state.paid !== "object") {
      alert("That file doesn't look like a valid saved state.");
      e.target.value = "";
      return;
    }

    if (!confirm("Load this file? It will replace your current expense list and checkmarks.")) {
      e.target.value = "";
      return;
    }

    // Clear existing paid: keys, then apply the loaded ones
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const key = localStorage.key(i);
      if (key.startsWith("paid:")) localStorage.removeItem(key);
    }
    Object.entries(state.paid).forEach(([key, val]) => {
      localStorage.setItem(key, val);
    });

    saveExpenses(state.expenses);
    e.target.value = "";
    render();
    alert("State loaded.");
  };
  reader.readAsText(file);
});

render();
</script>

</body>
</html>
